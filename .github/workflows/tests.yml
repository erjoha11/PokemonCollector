name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match Vercel's default Python runtime (3.12): tcg_inventory pins no
          # version (.python-version / pyproject / vercel.json). Full pin is #227.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/*/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
