<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auction Watcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Auction Watcher</h1>
  <div class="actions">
    <button id="overview" type="button">Open Dashboard</button>
    <button id="scan" type="button" aria-describedby="scan-hint">Scan feed</button>
    <p id="scan-hint" class="hint muted small"></p>
    <button id="read" type="button" aria-describedby="read-hint">Scan Post</button>
    <p id="read-hint" class="hint muted small"></p>
  </div>
  <p id="auto" class="muted small"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
