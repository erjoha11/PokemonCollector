<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auction Watcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Auction Watcher</h1>
  <p id="where" class="muted"></p>
  <div class="actions">
    <button id="read" type="button" hidden>Read this post</button>
    <button id="scan" type="button" hidden>Scan the feed</button>
    <button id="overview" type="button">Open overview</button>
  </div>
  <p id="auto" class="muted small"></p>
  <div class="dev">
    <button id="reload-ext" type="button" class="quiet">Reload extension</button>
    <button id="reload-fb" type="button" class="quiet">Reload Facebook tabs</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
