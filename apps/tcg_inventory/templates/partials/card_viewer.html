{# One shared card viewer for every page (included from base.html). Any
   element with card_view_attrs(card) (partials/macros.html) opens it on
   click and fills it in -- see static/card-viewer.js. #}
<dialog id="card-viewer" class="card-viewer" aria-labelledby="card-viewer-name">
  <div class="card-viewer-body">
    <img class="card-viewer-image" alt="">
    <div class="card-viewer-noimage muted">No picture of this card yet.</div>
    <div class="card-viewer-info">
      <h2 id="card-viewer-name" class="card-viewer-name"></h2>
      <p class="card-viewer-meta muted"></p>
      <p class="card-viewer-price"></p>
      <div class="card-viewer-actions">
        <a class="card-viewer-dex button-link" target="_blank" rel="noopener noreferrer">Open in Dex</a>
        <button type="button" class="secondary card-viewer-close">Close</button>
      </div>
    </div>
  </div>
</dialog>
