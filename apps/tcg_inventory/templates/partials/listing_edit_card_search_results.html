<div class="autocomplete-results">
  {% for card in results %}
  <button type="button" hx-get="/listings/{{ listing_id }}/edit/card-row?card_id={{ card.id }}"
          hx-target="#selected-cards-body" hx-swap="beforeend">
    {{ card.name }} — {{ card.set }} ({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %})
  </button>
  {% else %}
  <div class="muted">No matches</div>
  {% endfor %}
</div>
