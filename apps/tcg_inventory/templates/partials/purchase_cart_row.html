<tr>
  <td>
    <a href="https://app.dextcg.com/cards/{{ card.card_id | urlencode }}" target="_blank" rel="noopener noreferrer">{{ card.name }}</a>
    <span class="muted">({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %}{% if card.rarity %}, {{ card.rarity }}{% endif %})</span>
    <input type="hidden" name="card_id" value="{{ card.id }}">
  </td>
  <td class="cart-trade-only">
    {# Always submitted so it stays index-aligned with card_id/price; the
       server ignores it unless the order's type is Trade. #}
    <select name="direction">
      <option value="in">In (got)</option>
      <option value="out">Out (gave)</option>
    </select>
  </td>
  <td class="num cart-price-col"><input type="number" step="0.01" name="price" placeholder="Price" required class="tx-input-sm"
                         title="For a trade: any cash that moved with this card (paid on In, received on Out) — 0 if none."></td>
  <td><button type="button" class="secondary" onclick="this.closest('tr').remove()">Remove</button></td>
</tr>
