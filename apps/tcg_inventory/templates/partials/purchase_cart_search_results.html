<div class="autocomplete-results">
  {% for card in results %}
  <button type="button" onclick="addCardToCart({{ card.id }})">
    {{ card.name }} — {{ card.set }} ({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %})
  </button>
  {% else %}
  <div class="muted">No matches</div>
  {% endfor %}
</div>
