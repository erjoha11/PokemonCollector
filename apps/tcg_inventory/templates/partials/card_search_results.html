<div class="autocomplete-results">
  {% for card in results %}
  <div onclick="document.getElementById('card_id').value='{{ card.id }}'; document.getElementById('card_search').value='{{ card.name }} ({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %})'; this.parentElement.innerHTML='';">
    {{ card.name }} — {{ card.set }} ({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %})
  </div>
  {% else %}
  <div class="muted">Ingen treff</div>
  {% endfor %}
</div>
