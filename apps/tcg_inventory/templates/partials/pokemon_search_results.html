<div class="autocomplete-results">
  {% for name in results %}
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span>{{ name }}</span>
    <form method="post" action="/pokemon/favorite" style="display:inline;"
          hx-post="/pokemon/favorite" hx-select="#dashboard-pokemon-cards" hx-target="#dashboard-pokemon-cards" hx-swap="outerHTML">
      <input type="hidden" name="name" value="{{ name }}">
      <button type="submit" class="favorite-star{{ ' active' if name in favorite_pokemon else '' }}"
              title="{{ 'Remove as favorite' if name in favorite_pokemon else 'Set as favorite' }}">{{ '★' if name in favorite_pokemon else '☆' }}</button>
    </form>
  </div>
  {% else %}
  <div class="muted">No matches</div>
  {% endfor %}
</div>
