<div class="autocomplete-results">
  {% for card in results %}
  <button type="button" hx-post="/transactions/purchase/{{ purchase_id }}/edit/add-card?card_id={{ card.id }}"
          hx-target="#purchase-edit-rows" hx-swap="beforeend">
    {{ card.name }} — {{ card.set }} ({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %})
  </button>
  {% else %}
  <div class="muted">No matches</div>
  {% endfor %}
</div>
