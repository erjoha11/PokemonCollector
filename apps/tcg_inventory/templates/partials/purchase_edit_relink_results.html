<div class="autocomplete-results">
  {% for card in results %}
  <button type="button" hx-get="/transactions/purchase/{{ purchase_id }}/edit/row/{{ tx_id }}/relink?card_id={{ card.id }}"
          hx-target="#relink-cell-{{ tx_id }}" hx-swap="outerHTML">
    {{ card.name }} — {{ card.set }} ({{ card.card_id }}{% if card.variant %}, {{ card.variant }}{% endif %})
  </button>
  {% else %}
  <div class="muted">No matches</div>
  {% endfor %}
</div>
