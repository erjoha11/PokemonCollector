<div class="card mb-15">
  <h2>New Order <span class="muted">(Order ID {{ purchase_id }})</span></h2>
  <form method="post" action="/transactions/purchase"{% if type == 'trade' %} class="cart-is-trade"{% endif %}
        hx-post="/transactions/purchase" hx-select="#main-content" hx-target="#main-content" hx-swap="outerHTML"
        hx-indicator="#register-order-indicator"
        onsubmit="return confirmRegisterOrder(this)">
    <input type="hidden" name="purchase_id" value="{{ purchase_id }}">

    <div class="filters">
      <select name="type" onchange="this.form.classList.toggle('cart-is-trade', this.value === 'trade')">
        <option value="purchase" {{ 'selected' if type == 'purchase' }}>Purchase</option>
        <option value="sale" {{ 'selected' if type == 'sale' }}>Sale</option>
        <option value="trade" {{ 'selected' if type == 'trade' }}>Trade</option>
      </select>
      <input type="date" name="date" value="{{ today }}" required>
      <input type="text" name="platform" placeholder="Platform (optional)">
      <input type="number" step="0.01" name="purchase_total" placeholder="Agreed total (optional)"
             title="The full amount you paid for the order — used to show the diff against the sum of what you've actually recorded cards for.">
      <input type="number" step="0.01" name="purchase_shipping" placeholder="Shipping (optional)"
             title="Shipping cost for the whole order — subtracted along with the card total when the diff against the agreed total is calculated.">
    </div>

    <div class="autocomplete tx-search mt-1 mb-1">
      <input type="text" placeholder="Search for a card to add (name or card ID)..." autocomplete="off"
             hx-get="/transactions/purchase/search" hx-trigger="keyup changed delay:250ms" hx-target="#cart-search-results"
             hx-indicator="#cart-search-indicator"
             oninput="resetBrowseUnorderedToggle()" onkeydown="if (event.key === 'Enter') event.preventDefault();" name="q">
      <button type="button" class="muted secondary" id="browse-unordered-toggle" onclick="toggleBrowseUnordered(this)">Show cards without an order</button>
      <span id="cart-search-indicator" class="tx-search-spinner htmx-indicator">Searching…</span>
      <span id="cart-add-indicator" class="tx-search-spinner htmx-indicator">Adding…</span>
      <div id="cart-search-results"></div>
    </div>

    <table class="tx-table mb-075">
      <thead>
        <tr><th>Card</th><th class="cart-trade-only" title="In = a card you received, Out = a card you gave away.">In / Out</th><th class="num">Price</th><th></th></tr>
      </thead>
      <tbody id="cart-body">
      </tbody>
    </table>

    <div class="filters mb-1">
      <input type="number" step="0.01" id="remaining_sum" placeholder="Remaining amount (optional)" class="tx-input-xl">
      <button type="button" class="secondary" onclick="distributeRemaining()">Distribute evenly across empty prices</button>
    </div>

    <button type="submit">Register</button>
    <span id="register-order-indicator" class="tx-search-spinner htmx-indicator">Registering…</span>
    <button type="button" class="secondary" onclick="if (!confirmDiscardCart()) return; document.getElementById('purchase-cart-container').innerHTML='';">Cancel</button>
  </form>
</div>
