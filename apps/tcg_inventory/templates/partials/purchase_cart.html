<div class="card" style="margin-bottom: 1.5rem;">
  <h2>{{ 'Rediger' if editing else 'Nytt' }} {{ 'kjøp' if type == 'kjøp' else 'salg' }} <span class="muted">(Kjøps-ID {{ purchase_id }})</span></h2>
  <form method="post" action="/transactions/purchase">
    <input type="hidden" name="type" value="{{ type }}">
    <input type="hidden" name="purchase_id" value="{{ purchase_id }}">

    <div class="filters">
      <label class="field-label">Dato
        <input type="date" name="date" value="{{ date or today }}" required>
      </label>
      <label class="field-label">Platform
        <input type="text" name="platform" placeholder="Valgfritt" value="{{ platform or '' }}">
      </label>
      <label class="field-label">Avtalt totalsum
        <input type="number" step="0.01" name="purchase_total" placeholder="Valgfritt"
               title="Hele beløpet du betalte for kjøpet -- brukes til å vise diff mot summen av det du faktisk har registrert kort for."
               value="{{ purchase_total if purchase_total is not none else '' }}">
      </label>
      <label class="field-label">Frakt
        <input type="number" step="0.01" name="purchase_shipping" placeholder="Valgfritt"
               title="Fraktkostnad for hele kjøpet -- trekkes fra sammen med kortsummen når diff mot avtalt totalsum regnes ut."
               value="{{ purchase_shipping if purchase_shipping is not none else '' }}">
      </label>
    </div>

    <label class="field-label field-label-wide" style="margin: 0.6rem 0;">Notat
      <textarea name="note" placeholder="Valgfritt -- f.eks. selger eller kontekst rundt kjøpet"
                style="width: 100%; min-height: 3rem;">{{ note or '' }}</textarea>
    </label>

    <div class="autocomplete" style="max-width: 420px; margin: 0.75rem 0;">
      <input type="text" placeholder="Søk kort å legge til (navn eller card id)..." autocomplete="off"
             hx-get="/transactions/purchase/search" hx-trigger="keyup changed delay:250ms" hx-target="#cart-search-results"
             name="q">
      <div id="cart-search-results"></div>
    </div>

    <table style="margin-bottom: 0.75rem;">
      <thead>
        <tr><th>Kort</th><th class="num">Pris</th><th></th></tr>
      </thead>
      <tbody id="cart-body">
        {% for tx in rows %}
        {% set card = tx.card %}
        {% set tx_id = tx.id %}
        {% set price = tx.price %}
        {% include "partials/purchase_cart_row.html" %}
        {% endfor %}
      </tbody>
    </table>

    <div class="filters" style="margin-bottom: 0.9rem;">
      <input type="number" step="0.01" id="remaining_sum" placeholder="Sum for resten (valgfritt)" style="width: 200px;">
      <button type="button" onclick="distributeRemaining()">Fordel jevnt på tomme priser</button>
    </div>

    <button type="submit">{{ 'Lagre endringer' if editing else ('Registrer kjøpet' if type == 'kjøp' else 'Registrer salget') }}</button>
    <button type="button" onclick="document.getElementById('purchase-cart-container').innerHTML=''">Avbryt</button>
  </form>
</div>
