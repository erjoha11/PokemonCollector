{% from "partials/purchase_edit_card_cell.html" import purchase_edit_card_cell %}
{% macro purchase_edit_row(purchase_id, tx, next_purchase_id) %}
<tr>
  {{ purchase_edit_card_cell(purchase_id, tx.id, tx.card) }}
  <td>
    <select name="type">
      <option value="purchase" {% if tx.type == 'purchase' %}selected{% endif %}>Purchase</option>
      <option value="sale" {% if tx.type == 'sale' %}selected{% endif %}>Sale</option>
      <option value="trade" {% if tx.type == 'trade' %}selected{% endif %}>Trade</option>
    </select>
  </td>
  <td><input type="date" name="date" value="{{ tx.date.isoformat() }}" required style="width: 150px;"
             title="Defaults to today -- change it if the card was actually bought earlier."></td>
  <td class="num"><input type="number" step="0.01" name="price" value="{{ tx.price }}" required style="width: 100px;"></td>
  <td><input type="text" name="platform" value="{{ tx.platform or '' }}" style="width: 120px;"></td>
  <td>
    <input type="hidden" name="tx_id" value="{{ tx.id }}">
    <input type="text" name="note" value="{{ tx.note or '' }}" placeholder="Note" style="width: 160px;">
  </td>
  <td>
    <input type="number" name="new_purchase_id" value="{{ tx.purchase_id }}" style="width: 80px;">
    <button type="button" class="muted" onclick="this.previousElementSibling.value = {{ next_purchase_id }}">Start new order</button>
  </td>
  <td><input type="checkbox" name="delete_tx_id" value="{{ tx.id }}" title="Delete this row"></td>
</tr>
{% endmacro %}
