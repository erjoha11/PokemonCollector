<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TCG Inventory{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav>
    <strong>TCG Inventory</strong>
    <a href="/" class="{{ 'active' if request.url.path == '/' }}">Dashboard</a>
    <a href="/inventory" class="{{ 'active' if request.url.path == '/inventory' }}">Inventory</a>
    <a href="/transactions" class="{{ 'active' if request.url.path == '/transactions' }}">Transactions</a>
    <a href="/import" class="{{ 'active' if request.url.path == '/import' }}">Import / Sync</a>
    {% if auth_enabled() %}<a href="/logout" style="margin-left:auto;">Logg ut</a>{% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>

  <div id="card-modal-overlay" class="card-modal-overlay" hidden onclick="if (event.target === this) closeCardModal();">
    <div class="card-modal">
      <div class="card-modal-header">
        <span class="name" id="card-modal-name"></span>
        <div class="actions">
          <a id="card-modal-newtab" href="#" target="_blank" rel="noopener noreferrer">Åpne i ny fane ↗</a>
          <button type="button" class="card-modal-close" onclick="closeCardModal()" aria-label="Lukk">×</button>
        </div>
      </div>
      <iframe id="card-modal-iframe" src="" title="Dex-kort"></iframe>
    </div>
  </div>
  <script>
    // Card links open Dex's card page in this overlay instead of navigating
    // away -- a plain click stays "on the page"; ctrl/cmd/shift/middle-click
    // still falls through to the browser's normal new-tab/window behavior.
    function dexCardClick(event, anchor) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.button === 1) return;
      event.preventDefault();
      openCardModal(anchor.href, anchor.dataset.cardName || anchor.textContent);
    }
    function openCardModal(url, name) {
      document.getElementById('card-modal-name').textContent = name;
      document.getElementById('card-modal-newtab').href = url;
      document.getElementById('card-modal-iframe').src = url;
      document.getElementById('card-modal-overlay').hidden = false;
      document.addEventListener('keydown', _cardModalEscHandler);
    }
    function closeCardModal() {
      document.getElementById('card-modal-overlay').hidden = true;
      document.getElementById('card-modal-iframe').src = 'about:blank';
      document.removeEventListener('keydown', _cardModalEscHandler);
    }
    function _cardModalEscHandler(event) {
      if (event.key === 'Escape') closeCardModal();
    }
  </script>
</body>
</html>
